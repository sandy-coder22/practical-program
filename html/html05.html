<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Practical 5 | DevCore</title>
<style>

*{box-sizing:border-box}
:root{
  --bg:#fffaf7;--surface:#fff;--surface2:#fff7f2;
  --accent:#e9a3a0;--accent-dark:#c98583;
  --text:#3f3f46;--muted:#667085;--border:#eadfe0;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
nav{height:70px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7%;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px}.logo span{color:var(--accent)}
nav .links{display:flex;gap:28px}nav a{color:#667085;text-decoration:none;font-size:14px}nav a:hover{color:var(--accent-dark)}
main{max-width:1180px;margin:auto;padding:70px 7% 80px}
.tag{display:inline-block;color:var(--accent-dark);border:1px solid #e7c7c5;background:#fff0ed;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1.5px}
h1{font-size:clamp(34px,5vw,64px);line-height:1.08;margin:20px 0 15px;letter-spacing:-2px}
.lead{max-width:850px;color:var(--muted);font-size:18px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;margin-top:32px;box-shadow:0 15px 45px #d8cfd044}
h2{margin-top:0;color:#3f3f46}
button,.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;text-decoration:none;cursor:pointer}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:#fff;box-sizing:border-box}
label{display:block;margin:12px 0 6px;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid var(--border);padding:12px;text-align:left}th{background:#fff0ed}
img{max-width:100%;border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
footer{text-align:center;color:var(--muted);padding:25px;border-top:1px solid var(--border)}
@media(max-width:650px){nav{padding:0 5%}nav .links{gap:12px}nav a{font-size:12px}main{padding:45px 5%}}

</style>
</head>
<body>
<nav>
  <div class="logo">Dev<span>Core.</span></div>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="html05.html">HTML</a>
    <a href="index.html">CSS</a>
    <a href="index.html">JavaScript</a>
  </div>
</nav>
<main>
<span class="tag">HTML PRACTICAL 5</span>
<h1>Student Registration</h1><form class="panel" onsubmit="event.preventDefault();alert('Registration submitted successfully!')"><label>Full Name</label><input type="text" placeholder="Enter your name" required><label>Email</label><input type="email" placeholder="Enter email" required><label>Password</label><input type="password" placeholder="Create password" required><label>Course</label><select><option>CSE</option><option>ECE</option><option>AI & DS</option></select><label>Address</label><textarea rows="4" placeholder="Enter address"></textarea><br><br><button type="submit">Register</button></form>
</main>
<footer>DevCore • HTML Practical 5 • Pastel Theme</footer>
</body>
</html>
