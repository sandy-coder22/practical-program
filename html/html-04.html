<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HTML Practical 04 | Images & Hyperlinks</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#EAFFF7;color:#18352D;padding:35px 18px}main{max-width:950px;margin:auto}h1{color:#24966F}h2{color:#2D8066;margin-top:26px}p,li,dd{line-height:1.7;color:#607C72}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #B8E6D5;padding:13px;text-align:center}th{background:#DFF9EE}img{display:block;max-width:100%;border-radius:18px;margin:20px auto}form{background:#fff;padding:28px;border-radius:20px;border:1px solid #B8E6D5}label{display:block;font-weight:700;margin-top:12px}input,select,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #B8E6D5;border-radius:9px}button,.button{display:inline-block;margin-top:16px;background:#35A982;color:white;border:0;border-radius:9px;padding:11px 18px;text-decoration:none;font-weight:700}audio,video,iframe{display:block;width:100%;margin:20px auto}iframe{height:400px;border:2px solid #B8E6D5;border-radius:16px}.box{background:#fff;padding:28px;border-radius:20px;border:1px solid #B8E6D5;box-shadow:0 12px 30px #18352d12}.note,.highlight{padding:15px;background:#DFF9EE;border-left:5px solid #35A982;border-radius:10px}header{background:#18352D;color:#fff;padding:30px;border-radius:20px}header h1{color:#7DE2BA}nav,section,article,footer{padding:22px;border-radius:16px;margin-top:16px}nav{background:#fff;border:1px solid #B8E6D5}nav a{color:#24966F;margin-right:18px;text-decoration:none;font-weight:700}section{background:#fff;border:1px solid #B8E6D5}article{background:#F4FFFA;border-left:5px solid #35A982}footer{background:#18352D;color:#fff;text-align:center}.cards{display:flex;gap:18px;flex-wrap:wrap}.mini{flex:1;min-width:200px;background:#fff;padding:22px;border:1px solid #B8E6D5;border-radius:16px}.skills{display:flex;gap:10px;flex-wrap:wrap}.skills span{background:#DFF9EE;color:#24966F;padding:9px 15px;border-radius:999px;font-weight:700}.project{background:#F4FFFA;border-left:5px solid #35A982;padding:20px;border-radius:12px}@media(max-width:700px){.cards{flex-direction:column}}</style></head><body><main><div class="box"><h1>Images and Hyperlinks</h1><img src="https://picsum.photos/700/350" alt="Sample Image"><p>Visit a web development resource:</p><a class="button" href="https://developer.mozilla.org/" target="_blank">Visit MDN →</a></div></main></body></html>
